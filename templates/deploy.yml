name: Deploy (reusable)

on:
  push:
    branches:
      - release
      - staging
    paths-ignore:
      - '.deployed'
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - name: Install dependencies
        run: bundle install
      - name: Check for nanoc
        run: bundle exec nanoc --version
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Read AWS region from nanoc.yaml
        id: config
        run: |
          if [[ "${{ github.ref_name }}" == "staging" ]]; then
            BLOCK="staging"
          else
            BLOCK="production"
          fi
          REGION=$(awk "/^${BLOCK}:/{found=1; next} found && /^[^ ]/{exit} found" nanoc.yaml | grep 'aws_region:' | awk '{print $2}' | tr -d '"')
          if [[ -z "$REGION" ]]; then
            REGION=$(grep -E '^aws_region:' nanoc.yaml | awk '{print $2}' | tr -d '"')
          fi
          echo "aws_region=${REGION}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ steps.config.outputs.aws_region || secrets.AWS_REGION }}
      - name: Build and deploy
        run: |
          DEPLOY_FLAGS=""
          if [[ "${{ github.ref_name }}" == "staging" ]]; then
            DEPLOY_FLAGS="--staging"
          fi
          bash ./nanoc-shared-scripts/deploy.sh $DEPLOY_FLAGS
        env:
          CI: true
      - name: Merge release back into main
        if: github.ref_name == 'release'
        run: |
          git checkout main
          git pull origin main
          git merge -X theirs release --no-edit
          git push origin main
